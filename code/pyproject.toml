[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supervised-learning"
version = "0.1.0"
dependencies = [
    "certifi==2026.2.25",
    "matplotlib==3.10.8",
    "numpy==2.4.3",
    "pandas==3.0.1",
    "scikit-learn==1.8.0",
    "seaborn==0.13.2"
]

[tool.setuptools]
packages = ["regression", "classification"]

[tool.setuptools.package-dir]
regression = "Part1_Regression"
classification = "Part2_Classification"
